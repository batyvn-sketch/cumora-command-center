<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cumora 指挥中心 · 实时</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%233ec6d6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%233ec6d6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060c18; --panel2:#0e1a30; --panel3:#131f3a; --line:#1b2c48;
  --text:#dbe6f6; --dim:#7d94b5; --cyan:#3ec6d6; --cyan2:#7fe0ef;
  --mono:"SF Mono","JetBrains Mono","Menlo",monospace;
  --sans:"PingFang SC","Helvetica Neue",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column}
/* ===== 星空背景：星点闪烁 + 星云 + HUD 网格漂移 ===== */
/* 星点 + 星云层：整体柔和闪烁 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
  radial-gradient(1px 1px at 12% 18%, rgba(230,240,255,.9), transparent 55%),
  radial-gradient(1px 1px at 23% 62%, rgba(200,220,255,.6), transparent 55%),
  radial-gradient(1.5px 1.5px at 34% 31%, rgba(255,255,255,.8), transparent 55%),
  radial-gradient(1px 1px at 47% 12%, rgba(255,255,255,.5), transparent 55%),
  radial-gradient(1.5px 1.5px at 56% 48%, rgba(180,220,255,.7), transparent 55%),
  radial-gradient(1px 1px at 64% 78%, rgba(255,255,255,.55), transparent 55%),
  radial-gradient(1.5px 1.5px at 72% 22%, rgba(210,230,255,.75), transparent 55%),
  radial-gradient(1px 1px at 81% 55%, rgba(255,255,255,.45), transparent 55%),
  radial-gradient(1.5px 1.5px at 89% 85%, rgba(190,210,255,.6), transparent 55%),
  radial-gradient(1px 1px at 95% 33%, rgba(255,255,255,.55), transparent 55%),
  radial-gradient(1px 1px at 8% 84%, rgba(230,240,255,.55), transparent 55%),
  radial-gradient(1px 1px at 29% 92%, rgba(255,255,255,.45), transparent 55%),
  radial-gradient(1px 1px at 43% 41%, rgba(255,255,255,.4), transparent 55%),
  radial-gradient(1.5px 1.5px at 66% 9%, rgba(200,225,255,.7), transparent 55%),
  radial-gradient(1px 1px at 78% 68%, rgba(230,240,255,.5), transparent 55%),
  radial-gradient(1px 1px at 90% 6%, rgba(255,255,255,.55), transparent 55%),
  radial-gradient(1px 1px at 51% 57%, rgba(255,255,255,.7), transparent 55%),
  radial-gradient(1.5px 1.5px at 18% 34%, rgba(170,210,255,.65), transparent 55%),
  radial-gradient(1400px 700px at 12% -12%, rgba(62,198,214,.12), transparent 62%),
  radial-gradient(1100px 560px at 96% 112%, rgba(130,90,230,.11), transparent 62%),
  radial-gradient(900px 500px at 78% 28%, rgba(38,120,190,.08), transparent 60%);
  animation:starTwinkle 6.5s ease-in-out infinite}
/* 高亮星点层：交错闪烁 */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
  radial-gradient(1.5px 1.5px at 31% 44%, rgba(255,255,255,.95), transparent 55%),
  radial-gradient(1px 1px at 59% 24%, rgba(200,230,255,.85), transparent 55%),
  radial-gradient(1px 1px at 71% 61%, rgba(255,255,255,.75), transparent 55%),
  radial-gradient(1.5px 1.5px at 88% 41%, rgba(180,215,255,.85), transparent 55%),
  radial-gradient(1px 1px at 25% 76%, rgba(255,255,255,.7), transparent 55%),
  radial-gradient(1.5px 1.5px at 15% 8%, rgba(220,240,255,.9), transparent 55%),
  radial-gradient(1px 1px at 68% 88%, rgba(255,255,255,.65), transparent 55%);
  animation:starTwinkle 3.2s ease-in-out .4s infinite}
/* HUD 网格层：缓慢斜向漂移（星际超空间感） */
body .gridbg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(120,160,220,.055) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(120,160,220,.055) 39px 40px);
  animation:gridDrift 60s linear infinite}
/* ===== 背景：力导向 / 引力粒子网络 + 发光线条（Bram · 视觉轮）===== */
#bgfield{position:fixed;inset:0;z-index:0;pointer-events:none;display:block;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){#bgfield{display:none}}
@keyframes starTwinkle{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes gridDrift{0%{background-position:0 0,0 0}100%{background-position:-120px -90px,90px 60px}}
/* 面板通用：半透明碳纤维 + 顶部微光 */
header{flex:none;display:flex;align-items:center;gap:16px;padding:9px 20px;border-bottom:1px solid rgba(62,198,214,.22);
  background:linear-gradient(180deg,rgba(13,23,44,.92),rgba(7,13,26,.92));z-index:2;flex-wrap:wrap;
  box-shadow:0 1px 0 rgba(62,198,214,.14) inset,0 8px 24px rgba(0,0,0,.35)}
.brand{font-size:15px;font-weight:700;letter-spacing:.16em;color:#eaf4ff;text-shadow:0 0 14px rgba(62,198,214,.55),0 0 2px rgba(140,220,255,.6)}
.brand .sub{font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:2px;font-family:var(--mono)}
.metrics{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.metric{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);background:linear-gradient(180deg,rgba(19,31,58,.9),rgba(12,21,40,.9));
  border:1px solid rgba(60,105,165,.35);padding:4px 9px;border-radius:7px;font-family:var(--mono);transition:border-color .2s,box-shadow .2s}
.metric:hover{border-color:rgba(62,198,214,.5);box-shadow:0 0 8px rgba(62,198,214,.18)}
.metric b{color:var(--text);font-weight:600}
.metric .dot{width:6px;height:6px;border-radius:50%}
.dot.ok{background:#5fd39b;box-shadow:0 0 6px #5fd39b}.dot.warn{background:#e3b341}.dot.err{background:#ff6b6b;box-shadow:0 0 6px #ff6b6b}
.livepill{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:999px;border:1px solid rgba(60,105,165,.4);background:rgba(10,19,36,.8);color:var(--dim);white-space:nowrap}
.livepill .ldot{width:7px;height:7px;border-radius:50%;background:#5a6b85}
.livepill.on{color:#9ff0c4;border-color:rgba(95,211,155,.5);box-shadow:0 0 10px rgba(95,211,155,.25)}
.livepill.on .ldot{background:#5fd39b;box-shadow:0 0 8px #5fd39b;animation:blink 1.6s infinite}
.livepill .ts{color:var(--dim);font-size:10px;margin-left:4px}
.controls{display:flex;align-items:center;gap:8px}
.controls button{border:1px solid rgba(60,105,165,.4);background:linear-gradient(180deg,rgba(19,31,58,.9),rgba(12,21,40,.9));color:var(--dim);font-size:11px;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);transition:all .2s}
.controls button:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(62,198,214,.25)}
/* ===== 项目栏 ===== */
.projbar{flex:none;display:flex;gap:6px;padding:7px 20px;border-bottom:1px solid rgba(62,198,214,.16);background:rgba(7,13,26,.62);overflow-x:auto;scrollbar-width:none;z-index:2}
.projbar::-webkit-scrollbar{display:none}
.proj-tab{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid rgba(60,105,165,.35);border-radius:999px;background:rgba(40,90,160,.06);color:var(--dim);font-size:11px;cursor:pointer;white-space:nowrap;flex:none;transition:all .2s}
.proj-tab:hover{border-color:currentColor;box-shadow:0 0 8px rgba(62,198,214,.2)}
.proj-tab .sw{width:7px;height:7px;border-radius:50%;flex:none}
.proj-tab .cnt{font-size:10px;font-family:var(--mono);opacity:.75}
.proj-tab.on{color:#e6eefc;background:rgba(62,198,214,.10);border-color:currentColor;text-shadow:0 0 8px rgba(62,198,214,.5)}
.proj-tab.on .sw{box-shadow:0 0 8px currentColor}
/* ===== 主区 ===== */
main{flex:1;display:flex;min-height:0;position:relative;z-index:1}
.graph-wrap{flex:1;position:relative;min-width:0;min-height:340px;background:radial-gradient(800px 500px at 50% 42%,rgba(20,42,80,.18),transparent 70%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.glegend{position:absolute;bottom:10px;left:14px;display:flex;gap:12px;font-size:10px;color:var(--dim);font-family:var(--mono);background:rgba(7,13,26,.55);border:1px solid rgba(60,105,165,.25);border-radius:999px;padding:4px 12px;letter-spacing:.04em}
.glegend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.gempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a6b85;font-size:12px;font-family:var(--mono);letter-spacing:.1em}
.node-tip{position:absolute;z-index:30;pointer-events:none;display:none;min-width:190px;max-width:240px;
  background:rgba(9,17,33,.97);border:1px solid rgba(94,146,214,.5);border-radius:8px;
  padding:9px 11px;font-size:11px;line-height:1.55;color:#d7e4f6;box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 14px rgba(62,198,214,.18)}
.node-tip b{font-size:12px;color:#fff}
.node-tip .tt-role{color:#8aa3c8;font-size:10px;margin-bottom:3px}
.node-tip .tt-row{color:#9fb6d8;font-family:var(--mono);font-size:10px}
.node-tip .tt-row em{font-style:normal;color:#eaf6ff}
.node-tip .tt-bad{color:#ff8a94}
/* ===== 任务面板（左） ===== */
.tasks{width:280px;flex:none;border-right:1px solid rgba(62,198,214,.16);
  background:linear-gradient(180deg,rgba(11,19,36,.9),rgba(7,13,26,.92));display:flex;flex-direction:column;min-height:0;position:relative}
.tasks::before,.tasks::after,.arts::before,.arts::after{content:"";position:absolute;width:15px;height:15px;border:1px solid rgba(62,198,214,.55);pointer-events:none;z-index:3}
.tasks::before{top:5px;left:5px;border-right:none;border-bottom:none}
.tasks::after{bottom:5px;left:5px;border-right:none;border-top:none}
.tk-head{flex:none;position:relative;display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);
  font-size:11px;color:#8fd0ff;font-family:var(--mono);letter-spacing:.05em;text-shadow:0 0 8px rgba(62,198,214,.35)}
.tk-head::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:1px;background:linear-gradient(90deg,rgba(62,198,214,.65),rgba(62,198,214,0))}
.tk-head b{color:var(--text);text-shadow:none}
#taskList{flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:8px;display:flex;flex-direction:column;gap:7px}
#taskList::-webkit-scrollbar{display:none;width:0;height:0}
.day-head{display:flex;align-items:baseline;gap:8px;padding:2px 4px 0;font-size:10px;color:var(--dim);font-family:var(--mono);flex:none}
.day-head b{color:var(--cyan);font-weight:600}
.day-head em{font-style:normal;opacity:.7}
.day-head span{font-weight:600;color:#9db6d8}
.task{position:relative;background:linear-gradient(180deg,rgba(22,36,64,.85),rgba(13,22,42,.92));
  border:1px solid rgba(52,92,142,.38);border-radius:9px;padding:9px 11px;cursor:pointer;flex:none;
  transition:border-color .2s,box-shadow .2s,transform .2s}
.task::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:#5a8bff}
.task:has(.st.run)::before{background:#5fd39b;box-shadow:0 0 6px #5fd39b}
.task:has(.st.reset)::before{background:#ff9a4d;box-shadow:0 0 6px #ff9a4d}
.task:hover{border-color:rgba(62,198,214,.55);box-shadow:0 0 12px rgba(62,198,214,.14),inset 0 0 16px rgba(24,56,110,.2);transform:translateX(2px)}
.task .row1{display:flex;align-items:center;gap:7px}
.task .st{width:8px;height:8px;border-radius:50%;flex:none}
.task .st.run{background:#5fd39b;box-shadow:0 0 6px #5fd39b;animation:blink 1.6s infinite}
.task .st.done{background:#5a8bff}
.task .st.reset{background:#ff9a4d;box-shadow:0 0 6px #ff9a4d}
@keyframes blink{50%{opacity:.45}}
.task .ttl{font-size:12px;font-weight:600;color:#e6eefc;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--dim);font-family:var(--mono)}
.task .meta b{color:var(--text);font-weight:600}
.task .arts{margin-top:6px;display:none;flex-direction:column;gap:3px}
.task.open .arts{display:flex}
.task .art{font-size:10px;color:#9fd2e8;font-family:var(--mono);background:rgba(62,198,214,.07);border:1px solid rgba(62,198,214,.2);border-radius:5px;padding:3px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .tools{display:none;margin-top:6px;flex-wrap:wrap;gap:4px}
.task.open .tools{display:flex}
.task .tool{font-size:9px;font-family:var(--mono);color:var(--dim);background:rgba(120,140,180,.1);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
.task.sel{border-color:rgba(95,211,155,.85);box-shadow:0 0 12px rgba(95,211,155,.3),inset 0 0 14px rgba(95,211,155,.12)}
/* ===== 产出物面板（右） ===== */
.arts{width:252px;flex:none;border-left:1px solid rgba(62,198,214,.16);
  background:linear-gradient(180deg,rgba(11,19,36,.9),rgba(7,13,26,.92));display:flex;flex-direction:column;min-height:0;position:relative}
.arts::before{top:5px;right:5px;border-left:none;border-bottom:none}
.arts::after{bottom:5px;right:5px;border-left:none;border-top:none}
#artList{flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:8px;display:flex;flex-direction:column;gap:7px}
#artList::-webkit-scrollbar{display:none;width:0;height:0}
.art-card{display:flex;gap:9px;align-items:flex-start;background:linear-gradient(180deg,rgba(22,36,64,.85),rgba(13,22,42,.92));
  border:1px solid rgba(52,92,142,.38);border-radius:9px;padding:8px 10px;flex:none;transition:border-color .2s,box-shadow .2s}
.art-card:hover{border-color:rgba(62,198,214,.55);box-shadow:0 0 12px rgba(62,198,214,.14)}
.art-card .ic{flex:none;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:.04em;box-shadow:inset 0 0 10px rgba(0,0,0,.35)}
.art-card .ic.doc{background:rgba(90,139,255,.16);color:#7fa8ff;border:1px solid rgba(90,139,255,.4)}
.art-card .ic.code{background:rgba(104,220,160,.14);color:#66d9a8;border:1px solid rgba(104,220,160,.36)}
.art-card .ic.img{background:rgba(255,180,84,.14);color:#ffb454;border:1px solid rgba(255,180,84,.36)}
.art-card .ic.file{background:rgba(140,150,180,.14);color:#9db0cc;border:1px solid rgba(140,150,180,.34)}
.art-card .ai{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.art-card .ap{font-size:11px;color:#e6eefc;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:color .2s}
.art-card .ap:hover{color:#8fd0ff;text-shadow:0 0 8px rgba(143,208,255,.5)}
.art-card .am{font-size:9px;color:var(--dim);font-family:var(--mono);display:flex;gap:6px;flex-wrap:wrap}
.art-card .am b{color:var(--text);font-weight:600}
.art-card.sel{border-color:rgba(95,211,155,.85);box-shadow:0 0 12px rgba(95,211,155,.3)}
/* ===== 底部 ===== */
.bottom{flex:none;border-top:1px solid rgba(62,198,214,.2);background:linear-gradient(180deg,rgba(9,16,30,.9),rgba(6,11,22,.94));z-index:2;display:flex;flex-direction:column;max-height:34%;min-height:0;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.tokenbar{padding:7px 14px;border-bottom:1px solid var(--line)}
.tk-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding-bottom:2px}
.tk-row::-webkit-scrollbar{display:none}
.tk-cell{flex:1 1 90px;min-width:76px}
.tk-name{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);font-family:var(--mono);margin-bottom:3px}
.tk-name b{color:var(--text);font-weight:600}
.tk-bar{height:6px;border-radius:3px;background:rgba(94,146,214,.14);overflow:hidden;display:flex}
.tk-in{background:var(--cyan);height:100%;box-shadow:0 0 6px rgba(62,198,214,.4)}
.tk-out{background:rgba(255,180,84,.85);height:100%}
.tk-cell[data-zero]{opacity:.35}
.msgbar{padding:7px 14px 0;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:4px 0 8px;display:flex;flex-direction:column;gap:4px}
.msgs::-webkit-scrollbar{display:none;width:0;height:0}
.msg{display:flex;gap:9px;padding:4px 6px;border-radius:6px;font-size:11px;line-height:1.55;transition:background .2s}
.msg:hover{background:rgba(64,140,220,.08);box-shadow:inset 0 0 0 1px rgba(62,198,214,.15)}
.msg .t{font-family:var(--mono);color:var(--dim);flex:none;padding-top:1px;font-size:10px}
.msg .a{font-family:var(--mono);font-weight:700;flex:none;font-size:10px;padding-top:2px;text-shadow:0 0 6px rgba(62,198,214,.35)}
.msg .tx{color:#c9d8ee;flex:1;min-width:0;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.msg.open .tx{-webkit-line-clamp:unset}
.msg .g{flex:none;width:3px;border-radius:2px;box-shadow:0 0 5px rgba(62,198,214,.4)}
@media (max-width:900px){
  body{overflow:auto}
  main{flex-direction:column;flex:none;height:auto}
  .graph-wrap{height:300px;flex:none}
  .tasks{width:100%;border-left:none;border-top:1px solid var(--line);height:340px}
  .bottom{max-height:none}
  .metrics{gap:4px}
  .metric{padding:3px 7px;font-size:10px}
  .tasks{width:100%;border-right:none;border-bottom:1px solid var(--line);height:320px}
  .arts{width:100%;border-left:none;border-top:1px solid var(--line);height:300px}
  header{gap:10px;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){.task .st.run{animation:none}.livepill.on .ldot{animation:none}}
#fileHint{display:none;flex:none;align-items:center;gap:8px;padding:7px 20px;background:rgba(255,180,84,.1);border-bottom:1px solid rgba(255,180,84,.3);color:#ffd9a8;font-size:12px;z-index:2}
#fileHint b{color:#ffb454;font-family:var(--mono)}
@media (max-width:900px){#fileHint{padding:7px 12px;font-size:11px}}
</style>
</head>
<body>
  <div class="gridbg"></div>
  <canvas id="bgfield" aria-hidden="true"></canvas>
<header>
  <div class="brand">CUMORA 指挥中心<div class="sub">AGENT ORCHESTRATION // 实时 · 最近 4 小时窗口</div></div>
  <div class="metrics" id="metrics"></div>
  <div class="livepill" id="livepill"><span class="ldot"></span><span id="liveTxt">连接中</span><span class="ts" id="syncT"></span></div>
  <div class="controls"><button id="btnPause">暂停动画</button></div>
</header>

<div id="fileHint">实时数据源未连接 —— 请在浏览器打开 <b>http://127.0.0.1:8787/</b> 查看实时版（当前为离线状态）</div>

<main>
  <aside class="tasks">
    <div class="tk-head"><span>日期 · 工作任务</span><b id="taskCnt">—</b></div>
    <div id="taskList"></div>
  </aside>
  <div class="graph-wrap">
    <canvas id="scene"></canvas>
    <div id="nodeTip" class="node-tip"></div>
    <div class="glegend"><span><i style="background:#8fd0ff"></i>沟通·当前</span><span><i style="background:#5a8bff"></i>沟通·历史</span><span><i style="background:#ff4d5e"></i>@红晕</span><span><i style="background:#ff4d5e;box-shadow:0 0 6px #ff4d5e"></i>异常</span><span><i style="background:#ffd479;border-radius:50%"></i>BOSS</span><span style="border-left:1px solid var(--line);padding-left:12px">点星球切换 · 点空白回全部</span></div>
    <div class="gempty" id="gempty">正在连接实时数据源…</div>
  </div>
  <aside class="arts">
    <div class="tk-head"><span>产出物 · 文档 / 程序 / 图片</span><b id="artCnt">—</b></div>
    <div id="artList"></div>
  </aside>
</main>

function hashRGB(s){
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  const r = 90 + (h%110), g = 130 + ((h>>4)%100), b = 170 + ((h>>8)%70);
  return {rgb: r+","+g+","+b, hex: "#"+[r,g,b].map(function(v){ return ("0"+v.toString(16)).slice(-2); }).join("")};
}
const $ = function(id){ return document.getElementById(id); };

let S = null, curGroup = "all", curRGB = "62,198,214", curHex = "#3ec6d6";

function inG(g){ return curGroup === "all" || g === curGroup; }
function curTok(){
  if(!S) return {i:0,o:0,r:0,steps:0};
  if(curGroup === "all") return S.all_total;
  const g = S.tokens_g[curGroup]; return g ? g.total : {i:0,o:0,r:0,steps:0};
}
function curTokOf(a){
  if(!S) return {i:0,o:0,r:0,steps:0};
  if(curGroup === "all") return S.tokens_all[a] || {i:0,o:0,r:0,steps:0};
  const g = S.tokens_g[curGroup];
  return g && g.agents ? (g.agents[a] || {i:0,o:0,r:0,steps:0}) : {i:0,o:0,r:0,steps:0};
}
function curTasks(){ return (S ? S.tasks : []).filter(function(t){ return inG(t.group); }); }
function curMsgs(){ return (S ? S.messages : []).filter(function(m){ return inG(m.g); }); }
function fmtN(n){ return n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? (n/1e3).toFixed(1)+"K" : String(n||0); }
function fmtDur(s){ return s>=60 ? Math.round(s/60)+"m"+(s%60?s%60:"") : Math.round(s)+"s"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shortPath(p){ const s = String(p); return s.length>46 ? "…"+s.slice(-45) : s; }

function dayKey(ts){
  const d = new Date(ts * 1000);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayLabel(k){
  const d = new Date(k + "T00:00:00");
  const now = new Date();
  const same = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  const wd = ["日","一","二","三","四","五","六"][d.getDay()];
  return k.slice(5).replace("-","/") + " 周" + wd + (same ? " · 今天" : "");
}

// ===== 任务/产出物 ↔ agent 关联锚点（卡片屏幕位置 → 画布坐标缓存） =====
let taskAnchors = [], artAnchors = [];
function refreshAnchors(){
  taskAnchors = []; artAnchors = [];
  if(!S) return;
  const sr = scene.getBoundingClientRect();
  const W = sr.width, H = sr.height;
  document.querySelectorAll("#taskList .task").forEach(function(el){
    const r = el.getBoundingClientRect();
    if(r.bottom < sr.top || r.top > sr.bottom) return;
    taskAnchors.push({id: el.getAttribute("data-tid"), agent: el.getAttribute("data-agent"),
      x: Math.max(2, r.right - sr.left), y: Math.min(H-4, Math.max(4, r.top - sr.top + r.height/2))});
  });
  document.querySelectorAll("#artList .art-card").forEach(function(el){
    const r = el.getBoundingClientRect();
    if(r.bottom < sr.top || r.top > sr.bottom) return;
    artAnchors.push({id: el.getAttribute("data-aid"), agent: el.getAttribute("data-agent"),
      x: Math.min(W-2, r.left - sr.left), y: Math.min(H-4, Math.max(4, r.top - sr.top + r.height/2))});
  });
}

// 像素行星纹理生成器（参考 Pixel Planet Generator 风格；确定性随机，缓存复用）
function planetPix(g){
  const KEY = "__planetPix_"+g;
  if(window[KEY]) return window[KEY];
  const w=32,h=32;
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const c=cv.getContext("2d");
  const G=GROUPS.find(function(x){return x.id===g});
  const rgb = G ? G.rgb.split(",").map(Number) : [150,170,210];
  let s=0;
  for(let i=0;i<g.length;i++) s=(s*31+g.charCodeAt(i))>>>0;
  s=(s*1664525+1013904223)>>>0;
  const rnd=function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  const type = g==="eda" ? 0 : (g==="emag" ? 1 : 2);
  const img=c.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++){ for(let x=0;x<w;x++){
    const dx=(x+0.5)/w-0.5, dy=(y+0.5)/h-0.5;
    const i4=(y*w+x)*4;
    if(dx*dx+dy*dy>0.26){ d[i4+3]=0; continue; }
    let br;
    if(type===0){ // 岩质：噪声明暗 + 斑点
      const n=Math.sin(x*0.55+s)*Math.sin(y*0.55+s*2.1)+0.6*Math.sin(x*0.9+y*0.4+s*0.7);
      br=Math.floor(58*(n*0.5+0.5));
      const sp=Math.sin(x*0.22+s*3.3)*Math.sin(y*0.22+s*5.1);
      if(sp>0.55) br+=22; if(sp<-0.55) br-=14;
    } else if(type===1){ // 气态条纹
      const band=Math.sin(y*0.9)*Math.cos(x*0.4+s)+0.5*Math.sin(y*1.7+s*0.3)+rnd()*0.3;
      br=Math.floor(66*(band*0.5+0.5));
    } else { // 星云/发光行星：中心亮 + 噪声
      const r2=Math.sqrt(dx*dx+dy*dy)*2;
      br=Math.floor(96*(1-r2)+rnd()*20);
    }
    br=Math.max(0,Math.min(255,br));
    const bright=br/68;
    d[i4]=Math.max(0,Math.min(255,Math.round(rgb[0]*0.5+255*bright)));
    d[i4+1]=Math.max(0,Math.min(255,Math.round(rgb[1]*0.5+255*bright)));
    d[i4+2]=Math.max(0,Math.min(255,Math.round(rgb[2]*0.5+255*bright)));
    d[i4+3]=255;
  }}
  c.putImageData(img,0,0);
  window[KEY]=cv; return cv;
}

// 连线时间衰减：15s 内实时线不透明；超过 15s 半透明虚线；同对线由新交互替换
function lineAge(ts){ return (Date.now()/1000) - ts; }
function lineAlpha(ts, base){
  const age = lineAge(ts);
  if(age < 15) return base;
  return base * 0.25;
}

function drawGraph(pulse){
  if(!S) return;   // 数据未就绪时不绘制（启动段/离线保护，避免 null 访问中断 poll）
  const W = scene.clientWidth, H = scene.clientHeight;
  if(!W || !H) return;
  ctx.clearRect(0,0,W,H);
  const now = Date.now();
  const cx = W*0.5, cy = H*0.48;
  const R = Math.min(W, H)*0.38;
  // ===== 背景：少量极淡星点 =====
  if(!window.__stars || window.__starsW !== W || window.__starsH !== H){
    window.__starsW = W; window.__starsH = H; window.__stars = [];
    for(var si=0; si<26; si++){
      window.__stars.push({x:Math.random()*W, y:Math.random()*H, r:0.4+Math.random()*1.0, ph:Math.random()*6.283, sp:0.5+Math.random()*1.2});
    }
  }
  window.__stars.forEach(function(s){
    const a = 0.10 + 0.14*(0.5+0.5*Math.sin(now/2000*s.sp + s.ph));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283);
    ctx.fillStyle = "rgba(180,210,255,"+a.toFixed(3)+")"; ctx.fill();
  });
  // ===== agent 环轨道（旋转虚线） =====
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283);
  ctx.strokeStyle = "rgba(94,146,214,0.14)"; ctx.lineWidth = 1;
  ctx.setLineDash([2,7]); ctx.lineDashOffset = -now/90; ctx.stroke(); ctx.setLineDash([]);
  const N = AGENTS.length + 1;
  AGENTS.forEach(function(a,i){
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    a._x = cx + Math.cos(ang)*R;
    a._y = cy + Math.sin(ang)*R;
  });
  const bAng = -Math.PI/2 + (N-1)*2*Math.PI/N;
  const bx = cx + Math.cos(bAng)*R, by = cy + Math.sin(bAng)*R;
  window.__bx = bx; window.__by = by;
  // ===== 动态星球：置顶群全部有效（私聊不建星球）；超过 4h 无消息 → 背景态（缩小 + 55% 不透明度） =====
  const gmsgs = {};
  (S ? S.messages : []).forEach(function(m){ (gmsgs[m.g] = gmsgs[m.g] || []).push(m); });
  const pr = Math.max(22, R*0.15);
  const gl = (S && S.groups) ? S.groups.filter(function(g){ return g.id !== "priv"; }) : [];
  gl.forEach(function(gp){
    if(!GROUPS.some(function(x){ return x.id === gp.id; })){
      const hr = hashRGB(gp.id);
      GROUPS.push({id: gp.id, name: gp.name || gp.id, rgb: hr.rgb, hex: hr.hex});
    }
  });
  const extras = gl.filter(function(g){ return g.id !== "eda" && g.id !== "emag"; });
  const extraTot = Math.max(1, extras.length);
  PLANETS = gl.map(function(g){
    const gm = gmsgs[g.id] || [];
    const last = gm.length ? gm[0].ts : 0;   // 群最后消息时间（秒）
    if(g.id === "eda")  return {g:"eda",  x:cx-R*0.24, y:cy-R*0.12, r:pr, last:last};
    if(g.id === "emag") return {g:"emag", x:cx+R*0.24, y:cy-R*0.12, r:pr, last:last};
    const k = extras.indexOf(g);
    const ang = Math.PI - (k + 0.5) / extraTot * Math.PI;   // 底部弧（sin>0 落向下方）
    return {g:g.id, x:cx + Math.cos(ang)*R*0.26, y:cy + Math.sin(ang)*R*0.18, r:pr, last:last};
  });
  try{ window.__P = PLANETS.map(function(q){ return {g:q.g, x:Math.round(q.x), y:Math.round(q.y), r:Math.round(q.r), last:q.last}; }); }catch(e){}
  const runningIds = {};
  const badIds = {};
  curTasks().forEach(function(t){
    if(t.status==="running") runningIds[t.agent]=1;
    if(t.reset) badIds[t.agent]=1;
  });
  const badT = Object.keys(badIds);
  badT.forEach(function(an){
    const ts = curTasks().filter(function(x){return x.agent===an;});
    const lastReset = ts.filter(function(x){return x.reset;}).map(function(x){return x.end_ts || x.start_ts || 0;}).sort(function(a,b){return a-b;}).pop();
    if(!lastReset) return;
    let recovered = false;
    ts.forEach(function(x){ if(!x.reset && (x.end_ts || x.start_ts || 0) > lastReset) recovered = true; });
    if(!recovered && S){
      S.messages.forEach(function(m){ if(!recovered && m.a===an && m.ts > lastReset) recovered = true; });
    }
    if(recovered) delete badIds[an];
  });
  // 底层：关注虚线
  PLANETS.forEach(function(p){
    const gp = GROUPS.find(function(x){return x.id===p.g}); if(!gp) return;
    const ms = gmsgs[p.g] || []; if(!ms.length) return;
    const actors = {}; ms.slice(0,8).forEach(function(m){ actors[m.a]=1; });
    Object.keys(actors).forEach(function(an){
      const ag = AGENTS.find(function(x){return x.id===an}); if(!ag) return;
      let lts = 0;
      ms.forEach(function(m){ if(m.a===an && m.ts>lts) lts=m.ts; });
      const live = lts ? lineAge(lts) < 15 : false;
      const al = lineAlpha(lts||0, live ? 0.45 : 0.18);
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ag._x,ag._y);
      ctx.strokeStyle = "rgba("+gp.rgb+","+al.toFixed(3)+")";
      ctx.lineWidth = live?1.2:0.9;
      ctx.setLineDash(live?[]:[4,5]); ctx.stroke(); ctx.setLineDash([]);
    });
  });
  // 发言实线 + 流动光点
  PLANETS.forEach(function(p){
    const gp = GROUPS.find(function(x){return x.id===p.g}); if(!gp) return;
    const ms = gmsgs[p.g] || []; if(!ms.length) return;
    const ag = AGENTS.find(function(x){return x.id===ms[0].a});
    if(ag){
      const live = lineAge(ms[0].ts) < 15;
      const al = live ? 0.75 : 0.25;
      ctx.beginPath(); ctx.moveTo(ag._x,ag._y); ctx.lineTo(p.x,p.y);
      ctx.strokeStyle = "rgba("+gp.rgb+","+al+")"; ctx.lineWidth = live?1.3:1;
      ctx.setLineDash(live?[]:[4,5]); ctx.stroke(); ctx.setLineDash([]);
      if(live && pulse){
        const ph = (Math.sin(now/240)*0.5+0.5);
        ctx.beginPath(); ctx.arc((1-ph)*ag._x+ph*p.x, (1-ph)*ag._y+ph*p.y, 2.4, 0, 6.283);
        ctx.fillStyle = "rgba("+gp.rgb+",0.9)"; ctx.fill();
      }
    }
  });
  // 沟通线：1 新实线，2-3 虚线；@ 目标红晕
  if(S && S.comm){
    // 同对（from|to）只保留最新一条：被新交互线更新掉
    const commMap = {};
    S.comm.forEach(function(c){
      if(!c || !c.from || !c.to) return;
      const key = c.from+"|"+c.to;
      if(!commMap[key] || commMap[key].ts < c.ts) commMap[key] = c;
    });
    const comms = Object.keys(commMap).map(function(k){return commMap[k];})
      .sort(function(a,b){return b.ts-a.ts;}).slice(0,3);
    comms.forEach(function(c){
      const from = AGENTS.find(function(x){return x.id===c.from;});
      const to = AGENTS.find(function(x){return x.id===c.to;});
      if(!from || !to) return;
      const live = lineAge(c.ts) < 15;
      const al = live ? 0.8 : 0.25;
      const mx2 = (from._x+to._x)/2, my2 = (from._y+to._y)/2;
      // 控制点沿背离中心方向外推：私聊线走外圈，不穿过中央星球
      const ddx = mx2-cx, ddy = my2-cy, dd = Math.hypot(ddx,ddy)||1;
      const hx = mx2 + ddx/dd*R*0.42, hy = my2 + ddy/dd*R*0.42;
      ctx.beginPath(); ctx.moveTo(from._x,from._y);
      ctx.quadraticCurveTo(hx,hy,to._x,to._y);
      ctx.strokeStyle = "rgba(143,208,255,"+al+")";
      ctx.lineWidth = live ? 1.4 : 1.1;
      if(!live) ctx.setLineDash([4,5]);
      ctx.stroke(); ctx.setLineDash([]);
      if(live && pulse){
        const ph = (Math.sin(now/240)*0.5+0.5);
        ctx.beginPath(); ctx.arc((1-ph)*from._x+ph*to._x, (1-ph)*from._y+ph*to._y, 2.4, 0, 6.283);
        ctx.fillStyle = "rgba(143,208,255,0.9)"; ctx.fill();
      }
      if(pulse){
        const ph = (Math.sin(now/260)*0.5+0.5);
        const st = live ? 1 : 0.3;
        ctx.beginPath(); ctx.arc(to._x, to._y, 21+ph*6, 0, 6.283);
        ctx.strokeStyle = "rgba(255,77,94,"+(0.10+ph*0.32*st).toFixed(3)+")";
        ctx.lineWidth = 2; ctx.stroke();
      }
    });
  }
  // BOSS 红线
  const bossM = S && S.boss_mentions && S.boss_mentions[0];
  if(bossM){
    const ag = AGENTS.find(function(x){return x.id===bossM.from;});
    if(ag){
      const live = lineAge(bossM.ts) < 15;
      const al = live ? 1 : 0.3;
      ctx.beginPath(); ctx.moveTo(ag._x,ag._y); ctx.lineTo(bx,by);
      ctx.strokeStyle = "rgba(255,77,94,"+al+")"; ctx.lineWidth = live ? 1.5 : 1.1;
      if(!live) ctx.setLineDash([4,5]);
      ctx.stroke(); ctx.setLineDash([]);
      if(live && pulse){
        const ph = (Math.sin(now/260)*0.5+0.5);
        ctx.beginPath(); ctx.arc((1-ph)*ag._x+ph*bx, (1-ph)*ag._y+ph*by, 2.6, 0, 6.283);
        ctx.fillStyle = "#ff4d5e"; ctx.fill();
      }
      ctx.fillStyle = live ? "#ff8a94" : "rgba(255,138,148,0.4)";
      ctx.font = "9px monospace"; ctx.textAlign = "center";
      ctx.fillText(ag.id.toUpperCase()+" @ 你  "+bossM.t, (ag._x+bx)/2, (ag._y+by)/2-8);
    }
  }
  // ===== agent 状态推断：run 工作 / think 思考 / online 在线 / idle 空闲 =====
  const lastTs = {};
  (S.messages||[]).forEach(function(m){ if(m.a && (!lastTs[m.a] || m.ts>lastTs[m.a])) lastTs[m.a]=m.ts; });
  (S.comm||[]).forEach(function(c){ [c.from,c.to].forEach(function(x){ if(x && (!lastTs[x] || c.ts>lastTs[x])) lastTs[x]=c.ts; }); });
  const ST_LABEL = {run:"工作中", think:"思考中", online:"在线", idle:"空闲"};
  const ST_COL = {run:"#5fd39b", think:"#8fd0ff", online:"#3ec6d6", idle:"#7d9cc4"};
  // ===== agent 节点：圆盘 + 简洁机器人头像 =====
  window.__badIds = badIds;
  AGENTS.forEach(function(a){
    const act = runningIds[a.id] ? 1 : 0.28;
    const bad = badIds[a.id] ? 1 : 0;
    const hov = hoverAgent === a.id;
    const r = 15 + act*4 + (hov ? 3 : 0);
    const lt = lastTs[a.id] || 0;
    const st = runningIds[a.id] ? "run" : (lt && lineAge(lt) < 15 ? "think" : (lt ? "online" : "idle"));
    const stLabel = ST_LABEL[st];
    const col = bad ? "#ff4d5e" : (act>0.5 ? curHex : "#5f7ea6");
    const rgbc = bad ? "255,77,94" : curRGB;
    // hover 高亮外圈
    if(hov && pulse){
      const ph = (Math.sin(now/220)*0.5+0.5);
      ctx.beginPath(); ctx.arc(a._x,a._y,r+6+ph*3,0,6.283);
      ctx.strokeStyle = "rgba(143,208,255,"+(0.35+ph*0.4).toFixed(3)+")";
      ctx.lineWidth = 2; ctx.stroke();
    }
    // 异常红环
    if(bad){
      const ph = pulse ? (Math.sin(now/300)*0.5+0.5) : 0.5;
      ctx.beginPath(); ctx.arc(a._x,a._y,r+5+ph*3,0,6.283);
      ctx.strokeStyle = "rgba(255,77,94,"+(0.35+ph*0.4).toFixed(3)+")";
      ctx.lineWidth = 2; ctx.stroke();
    }
    // agent 图标主体（游戏道具风素材）：直接绘制，无底圆/无圆形裁剪/无外圈
    const ic = AGENT_ICONS[a.id];
    if(ic && AGENT_ICON_LOADED[a.id]){
      const isz = r*2.4;
      // 按图标本体包围盒等比缩放（contain）：完整图标，仅比例缩放
      const mt = ICON_META[a.id];
      let sx = 0, sy = 0, sw = ic.width, sh = ic.height;
      if(mt){
        sw = ic.width * mt.w; sh = ic.height * mt.h;
        sx = ic.width * mt.x; sy = ic.height * mt.y;
      }
      const sc = Math.min(isz/sw, isz/sh);
      const dw = sw*sc, dh = sh*sc;
      const bob = st==="run" ? Math.sin(now/420)*2.0 : 0;
      ctx.drawImage(ic, sx, sy, sw, sh, a._x-dw/2, a._y-dh/2+bob, dw, dh);
      window.__iconCount = (window.__iconCount||0)+1;
    } else {
      // 兜底：图标未加载时显示小光点（防空白）
      ctx.beginPath(); ctx.arc(a._x,a._y,Math.max(4,r*0.5),0,6.283);
      ctx.fillStyle = "rgba("+rgbc+",0.8)"; ctx.fill();
    }
    // 运行中：图标右下角小三角指示（非圆圈动效）
    if(act>0.5){
      const ix = a._x+r*0.80, iy = a._y+r*0.80, i2 = r*0.30;
      ctx.beginPath();
      ctx.moveTo(ix,iy-i2); ctx.lineTo(ix+i2*1.3,iy); ctx.lineTo(ix,iy); ctx.closePath();
      ctx.fillStyle = "#5fd39b"; ctx.fill();
    }
    // ===== 状态动效（点式，不画整圈/半圈） =====
    if(st==="run"){
      const p2 = 0.5+0.5*Math.sin(now/300);
      ctx.beginPath(); ctx.arc(a._x+r*1.05, a._y-r*1.05, 2+1.3*p2, 0, 6.283);
      ctx.fillStyle = "rgba(95,211,155,"+(0.45+0.55*p2).toFixed(3)+")"; ctx.fill();
    } else if(st==="think"){
      for(let i=0;i<3;i++){
        const ph = (Math.sin(now/240+i*2.1)*0.5+0.5);
        ctx.beginPath(); ctx.arc(a._x-r*1.2+i*4.6, a._y-r*1.0, 1.6, 0, 6.283);
        ctx.fillStyle = "rgba(143,208,255,"+(0.25+0.6*ph).toFixed(3)+")"; ctx.fill();
      }
    } else if(st==="online"){
      const p3 = 0.5+0.5*Math.sin(now/460);
      ctx.beginPath(); ctx.arc(a._x, a._y+r*1.18, 1.8+0.9*p3, 0, 6.283);
      ctx.fillStyle = "rgba(62,198,214,"+(0.35+0.5*p3).toFixed(3)+")"; ctx.fill();
    }
    // 文字（矮画布合并单行 + y 钳制防溢出）
    const compact = H < 300;
    ctx.textAlign = "center";
    if(compact){
      ctx.fillStyle = bad ? "#ff8a94" : (act>0.5 ? "#f2f8ff" : "#9db4d6");
      ctx.font = "600 9px monospace";
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(4,10,20,0.82)";
      const lineY = Math.max(10, Math.min(a._y + r + 15, H-10));
      ctx.strokeText(a.id.toUpperCase() + " · " + (bad ? "异常" : stLabel), a._x, lineY);
      ctx.fillText(a.id.toUpperCase() + " · " + (bad ? "异常" : stLabel), a._x, lineY);
    } else {
      ctx.fillStyle = bad ? "#ff8a94" : (act>0.5 ? "#f2f8ff" : "#9db4d6");
      ctx.font = "600 10px monospace";
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(4,10,20,0.82)";
      const ny2 = Math.max(12, a._y-r-7);
      ctx.strokeText(a.id.toUpperCase(), a._x, ny2); ctx.fillText(a.id.toUpperCase(), a._x, ny2);
      ctx.font = "9px sans-serif";
      ctx.fillStyle = bad ? "#ff8a94" : ST_COL[st];
      const ry2 = Math.min(a._y+r+14, H-10);
      ctx.strokeText(bad ? "异常" : a.role + " · " + stLabel, a._x, ry2); ctx.fillText(bad ? "异常" : a.role + " · " + stLabel, a._x, ry2);
    }
  });
  // ===== BOSS：人类头像 =====
  const bHov = hoverAgent === "boss";
  const br = 16 + (bossM ? 2 : 0) + (bHov ? 2 : 0);
  if(bHov && pulse){
    const ph = (Math.sin(now/220)*0.5+0.5);
    ctx.beginPath(); ctx.arc(bx,by,br+6+ph*3,0,6.283);
    ctx.strokeStyle = "rgba(255,212,121,"+(0.35+ph*0.4).toFixed(3)+")";
    ctx.lineWidth = 2; ctx.stroke();
  }
  const bp = bossM ? (Math.sin(now/300)*0.5+0.5) : 0;
  if(pulse && bossM){
    ctx.beginPath(); ctx.arc(bx,by,br+6+bp*6,0,6.283);

  }
  // 金色发光球（保留人形脸识别）
  const bgHalo = ctx.createRadialGradient(bx,by,0,bx,by,br*2.2);
  bgHalo.addColorStop(0, "rgba(255,212,121,"+(bossM?0.5:0.24)+")");
  bgHalo.addColorStop(1, "rgba(255,212,121,0)");
  ctx.beginPath(); ctx.arc(bx,by,br*2.2,0,6.283); ctx.fillStyle = bgHalo; ctx.fill();
  const bg = ctx.createRadialGradient(bx-br*0.35,by-br*0.35,br*0.15,bx,by,br);
  bg.addColorStop(0, "#fff3d6");
  bg.addColorStop(0.45, "rgba(255,212,121,"+(bossM?0.95:0.75)+")");
  bg.addColorStop(1, "rgba(255,190,80,0.25)");
  ctx.beginPath(); ctx.arc(bx,by,br,0,6.283);
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = bossM ? "#ff4d5e" : "#ffd479";
  ctx.lineWidth = bossM ? 1.8 : 1.2; ctx.stroke();
  // 简绘人形脸：脸 + 头发 + 双眼
  ctx.beginPath(); ctx.arc(bx, by-br*0.22, br*0.4, 0, 6.283);
  ctx.fillStyle = "#ffe4c0"; ctx.fill();
  ctx.strokeStyle = "rgba(255,212,121,0.8)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by-br*0.30, br*0.4, Math.PI*1.05, Math.PI*1.95);
  ctx.strokeStyle = "#4a5a78"; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.fillStyle = "#3a4a66";
  ctx.beginPath(); ctx.arc(bx-br*0.15, by-br*0.22, 1.5, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+br*0.15, by-br*0.22, 1.5, 0, 6.283); ctx.fill();
  // 肩
  ctx.beginPath(); ctx.roundRect(bx-br*0.55, by+br*0.16, br*1.1, br*0.42, br*0.28);
  ctx.fillStyle = "rgba(30,40,62,0.92)"; ctx.fill();
  ctx.strokeStyle = bossM ? "#ff8a94" : "#ffd479"; ctx.lineWidth = 1; ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(20,12,0,0.8)";
  ctx.fillStyle = "#ffd9a8"; ctx.font = "700 10px monospace"; ctx.textAlign = "center";
  const bny = Math.max(12, by-br*0.85);
  ctx.strokeText("BOSS", bx, bny); ctx.fillText("BOSS", bx, bny);
  ctx.font = "9px sans-serif"; ctx.fillStyle = "#d9b878";
  const bty = Math.min(by+br+12, H-10);
  ctx.strokeText("你", bx, bty); ctx.fillText("你", bx, bty);
  // ===== 星球：建造中（轨道 + 弧线 + 光点） =====
  PLANETS.forEach(function(p){
    const gp = GROUPS.find(function(x){return x.id===p.g}); if(!gp) return;
    const ms = gmsgs[p.g] || [];
    const sel = p.g === curGroup;
    const fresh = ms.length && ((now/1000 - ms[0].ts) < 150);
    // 超 4h 无消息 → 背景态：缩小 0.62 + 不透明度 55%（选中时恢复）
    const STALE_S = 4*3600;
    const stale = !sel && (!p.last || (now/1000 - p.last) > STALE_S);
    if(stale){
      ctx.save();
      ctx.translate(p.x, p.y); ctx.scale(0.62, 0.62); ctx.translate(-p.x, -p.y);
    }
    // ===== 群 @ 我：agent → 星球（红） + 星球 → 我（红） + 星球红脉冲 =====
    const bosssrc = (S && S.messages || []).filter(function(m){
      return m.g===p.g && /@you\b|@u-[a-f0-9]+|\bbatyvn\b/i.test(m.txt||"");
    }).sort(function(a,b){return b.ts-a.ts;})[0];
    if(bosssrc){
      const blive = lineAge(bosssrc.ts) < 15;
      const bsrcAg = AGENTS.find(function(x){return x.id===bosssrc.a});
      if(bsrcAg){
        const ba = blive ? 0.85 : 0.2;
        ctx.beginPath(); ctx.moveTo(bsrcAg._x,bsrcAg._y); ctx.lineTo(p.x,p.y);
        ctx.strokeStyle = "rgba(255,77,94,"+ba+")"; ctx.lineWidth = blive?1.4:1;
        if(!blive) ctx.setLineDash([4,5]);
        ctx.stroke(); ctx.setLineDash([]);
      }
      const bba = blive ? 0.9 : 0.2;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(bx,by);
      ctx.strokeStyle = "rgba(255,77,94,"+bba+")"; ctx.lineWidth = blive?1.5:1;
      if(!blive) ctx.setLineDash([4,5]);
      ctx.stroke(); ctx.setLineDash([]);
      if(pulse){
        const ph = (Math.sin(now/280)*0.5+0.5);
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r+5+ph*7,0,6.283);
        ctx.strokeStyle = "rgba(255,77,94,"+(blive?(0.28+ph*0.5):(0.08+ph*0.14)).toFixed(3)+")";
        ctx.lineWidth = 2; ctx.stroke();
      }
    }
    // 旋转虚线轨道
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+7, 0, 6.283);
    ctx.strokeStyle = "rgba("+gp.rgb+",0.28)"; ctx.lineWidth = 1;
    ctx.setLineDash([3,6]); ctx.lineDashOffset = -now/140; ctx.stroke(); ctx.setLineDash([]);
    // 星球体：大发光球（halo，半透明）
    const pglow = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.3);
    pglow.addColorStop(0, "rgba("+gp.rgb+","+(sel?0.38:0.22)+")");
    pglow.addColorStop(1, "rgba("+gp.rgb+",0)");
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.3,0,6.283);
    ctx.fillStyle = pglow; ctx.fill();
    // 星球体：像素行星纹理（半透明表面 + 左上高光）
    ctx.save();
    ctx.globalAlpha = (sel ? 0.82 : 0.68) * (stale ? 0.55 : 1);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    const pix = planetPix(p.g);
    ctx.drawImage(pix, p.x-p.r, p.y-p.r, p.r*2, p.r*2);
    const hg = ctx.createRadialGradient(p.x-p.r*0.45,p.y-p.r*0.45,p.r*0.1,p.x,p.y,p.r*1.4);
    hg.addColorStop(0,"rgba(255,255,255,0.26)"); hg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = sel ? "rgba(255,255,255,0.9)" : "rgba("+gp.rgb+",0.75)";
    ctx.lineWidth = sel ? 2 : 1.1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.stroke();
    // 私聊：倾斜光环（土星式）
    if(p.g==="priv"){
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r*1.42, p.r*0.44, -0.35, 0, 6.283);
      ctx.strokeStyle = "rgba("+gp.rgb+",0.80)"; ctx.lineWidth = p.r*0.11; ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r*1.55, p.r*0.52, -0.35, 0, 6.283);
      ctx.strokeStyle = "rgba("+gp.rgb+",0.35)"; ctx.lineWidth = p.r*0.06; ctx.stroke();
    }
    // 十字星点（参考图星空元素）
    if(pulse){
      const sparks = p.g==="priv" ? [[0.85,-0.85],[-0.75,-0.6],[0.55,0.9]] : [[0.8,-0.8],[-0.72,-0.55],[0.5,0.88]];
      sparks.forEach(function(s,idx){
        const sx = p.x + s[0]*p.r*1.85, sy = p.y + s[1]*p.r*1.85;
        const tw = 0.6+0.4*Math.sin(now/320 + idx*2.1);
        ctx.beginPath();
        ctx.moveTo(sx-4.5*tw, sy); ctx.lineTo(sx+4.5*tw, sy);
        ctx.moveTo(sx, sy-4.5*tw); ctx.lineTo(sx, sy+4.5*tw);
        ctx.strokeStyle = "rgba(255,255,255,"+(0.35+0.4*tw).toFixed(3)+")";
        ctx.lineWidth = 1; ctx.stroke();
      });
    }
    // 活动光环（淡）
    if(fresh && pulse){
      const ph = (Math.sin(now/260)*0.5+0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r+3+ph*4, 0, 6.283);
      ctx.strokeStyle = "rgba("+gp.rgb+","+(0.15+ph*0.35).toFixed(3)+")";
      ctx.lineWidth = 1.5; ctx.stroke();
    }
    const nm = (function(){ const GX = GROUPS.find(function(x){ return x.id === p.g; }); return GX ? GX.name : p.g; })();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(4,10,20,0.82)";
    ctx.fillStyle = sel ? "#ffffff" : "#dfe9f8";
    ctx.font = "600 11px sans-serif";
    ctx.textAlign = "center";
    const ny = Math.max(12, p.y - p.r - 11);
    ctx.strokeText(nm, p.x, ny); ctx.fillText(nm, p.x, ny);
    ctx.fillStyle = "rgba("+gp.rgb+",0.95)"; ctx.font = "8px sans-serif";
    const by2 = Math.min(p.y + p.r + 5, H-10);
    ctx.strokeText("建造中", p.x, by2); ctx.fillText("建造中", p.x, by2);
    ctx.font = "9px monospace"; ctx.fillStyle = "rgba("+gp.rgb+",1)";
    const cy2 = Math.min(p.y + p.r + 23, H-10);
    ctx.strokeText(ms.length + " 条", p.x, cy2); ctx.fillText(ms.length + " 条", p.x, cy2);
    if(stale) ctx.restore();   // 背景态缩放结束
  });
  // ===== 任务 / 产出物 ↔ agent 绿色关联线（默认 15% 透明，选中 85%） =====
  ctx.lineCap = "round";
  taskAnchors.forEach(function(an){
    const ag = AGENTS.find(function(x){return x.id===an.agent}); if(!ag) return;
    const sel = window.__selTask === an.id;
    ctx.beginPath(); ctx.moveTo(ag._x, ag._y); ctx.lineTo(an.x, an.y);
    ctx.strokeStyle = "rgba(95,211,155,"+(sel ? 0.85 : 0.15)+")";
    ctx.lineWidth = sel ? 1.6 : 1; ctx.stroke();
  });
  artAnchors.forEach(function(an){
    const ag = AGENTS.find(function(x){return x.id===an.agent}); if(!ag) return;
    const sel = window.__selArt === an.id;
    ctx.beginPath(); ctx.moveTo(ag._x, ag._y); ctx.lineTo(an.x, an.y);
    ctx.strokeStyle = "rgba(95,211,155,"+(sel ? 0.85 : 0.15)+")";
    ctx.lineWidth = sel ? 1.6 : 1; ctx.stroke();
  });
  ctx.lineCap = "butt";
  const sceneEl = document.getElementById("scene");
  if(sceneEl) sceneEl.setAttribute("data-icons", String(window.__iconCount||0));
}

function highlightTask(tid){
  const el = taskList.querySelector('.task[data-tid="'+tid+'"]');

    el.scrollIntoView({block:"nearest", behavior:"smooth"});
    el.style.borderColor = curHex;

/* ================= 轮询 ================= */
async function poll(){
  try{
    const r = await fetch("api/snapshot", {cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    const s = await r.json();
    S = s;
    $("livepill").classList.add("on");
    $("liveTxt").textContent = "LIVE · 4h";
    $("syncT").textContent = new Date(s.generated_at).toLocaleTimeString("zh-CN",{hour12:false});
    $("gempty").style.display = "none";
    renderAll();
  }catch(e){
    $("livepill").classList.remove("on");
    $("liveTxt").textContent = "离线 · 静态";
    $("syncT").textContent = "";
  }
}
function renderAll(){
  renderMetrics(); renderTokenBar(); renderTasks(); renderMsg(); renderArts(); drawGraph(false);
}
function loop(){ if(!pauseAni && S){ drawGraph(true); } requestAnimationFrame(loop); }

/* ================= 项目切换（星球点击） ================= */
function setGroup(g){
  const gp = GROUPS.find(function(x){return x.id===g}); if(!gp) return;
  curGroup = g; curRGB = gp.rgb; curHex = gp.hex;
  renderAll();
}
scene.addEventListener("click", function(e){
  const r = scene.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  for(var i=0;i<PLANETS.length;i++){
    const p = PLANETS[i];
    if(Math.hypot(x-p.x, y-p.y) < p.r+12){
      if(p.g !== curGroup) setGroup(p.g);
      return;
    }
  }
  // 点击空白处回到全部项目
  if(curGroup !== "all") setGroup("all");
});
/* ===== 节点悬浮详情 ===== */
var hoverAgent = null;
function fmtAgo(ts){
  const s = (Date.now()/1000 - ts); if(!(s>=0) || s < 5) return "刚刚";
  if(s < 60) return Math.floor(s)+" 秒前";
  if(s < 3600) return Math.floor(s/60)+" 分钟前";
  return Math.floor(s/3600)+" 小时前";
}
function fmtK(n){ return (n/1000/1000).toFixed(1)+"M"; }
function tipHTML(id, bx2, by2){
  const isBoss = id === "boss";
  if(isBoss){
    const bm = (S && S.boss_mentions) ? S.boss_mentions.length : 0;
    const lastB = (S && S.boss_mentions && S.boss_mentions[0]) ? S.boss_mentions[0] : null;
    return '<b>BOSS · 你</b><div class="tt-role">人类（非机器人）</div>'
      + '<div class="tt-row">被 @ 提及 <em>'+bm+'</em> 次</div>'
      + (lastB ? '<div class="tt-row">最近 @ <em>'+fmtAgo(lastB.ts)+'</em></div>' : '');
  }
  const a = AGENTS.find(function(x){return x.id===id;}); if(!a) return "";
  const ts2 = curTasks().filter(function(t){return t.agent===id;});
  const run = ts2.filter(function(t){return t.status==="running";}).length;
  const done = ts2.filter(function(t){return t.status==="done";}).length;
  const msgs = (S ? S.messages : []).filter(function(m){return m.a===id;});
  const tk = (S && S.tokens_all && S.tokens_all[id]) || {i:0,o:0,r:0,steps:0};
  const bad = (window.__badIds && window.__badIds[id]) ? 1 : 0;
  const st = bad ? '<span class="tt-bad">异常（会话重置未恢复）</span>' : (run ? "运行中" : "空闲");
  const lastM = msgs.length ? msgs[0] : null;
  return '<b>'+a.id.toUpperCase()+'</b><div class="tt-role">'+a.role+'</div>'
    + '<div class="tt-row">状态 <em>'+st+'</em> · 进行中 <em>'+run+'</em> · 完成 <em>'+done+'</em></div>'
    + '<div class="tt-row">消息 <em>'+msgs.length+'</em> 条'+(lastM ? ' · 最近 <em>'+fmtAgo(lastM.ts)+'</em>' : '')+'</div>'
    + '<div class="tt-row">Token <em>IN '+fmtK(tk.i)+' · OUT '+fmtK(tk.o)+'</em> · <em>'+tk.steps+'</em> 步</div>';
}
scene.addEventListener("mousemove", function(e){
  const Wm = scene.clientWidth, Hm = scene.clientHeight;
  const r = scene.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const tip = $("nodeTip");
  let hit = null;
  AGENTS.forEach(function(a){
    if(Math.hypot(x-a._x, y-a._y) < (15+4)+8) hit = {id:a.id, x:a._x, y:a._y};
  });
  if(!hit){
    const br2 = 16+2;
    if(Math.hypot(x-window.__bx, y-window.__by) < br2+8) hit = {id:"boss", x:window.__bx, y:window.__by};
  }
  if(hit){
    if(hoverAgent !== hit.id) hoverAgent = hit.id;
    tip.innerHTML = tipHTML(hit.id, hit.x, hit.y);
    tip.style.display = "block";
    const tw = tip.offsetWidth || 200, th = tip.offsetHeight || 100;
    let tx = hit.x + 14, ty = hit.y - th - 10;
    if(tx + tw > Wm) tx = hit.x - tw - 14;
    if(ty < 4) ty = hit.y + 16;
    if(ty + th > Hm) ty = Hm - th - 4;
    tip.style.left = Math.max(4, Math.min(tx, Wm-tw-4)) + "px";
    tip.style.top = Math.max(4, Math.min(ty, Hm-th-4)) + "px";
  } else {
    if(hoverAgent !== null) hoverAgent = null;
    tip.style.display = "none";
  }
});
scene.addEventListener("mouseleave", function(){ hoverAgent = null; $("nodeTip").style.display = "none"; });
$("btnPause").addEventListener("click", function(){
  pauseAni = !pauseAni;
  this.textContent = pauseAni ? "播放动画" : "暂停动画";
  this.style.color = pauseAni ? "#ffb454" : "";
});

/* ================= 启动 ================= */
window.addEventListener("resize", function(){ layoutGraph(); refreshAnchors(); if(S) drawGraph(false); });
window.__selTask = null; window.__selArt = null;
taskList.addEventListener("scroll", refreshAnchors);
artList.addEventListener("scroll", refreshAnchors);
(function(){
  var gw = document.querySelector('.graph-wrap');
  if(gw && 'ResizeObserver' in window){
    var ro = new ResizeObserver(function(){
      if(!S) return;
      layoutGraph(); drawGraph(false);
    });
    ro.observe(gw);
    window.__graphRO = ro;
  }
})();
if(location.protocol === "file:"){
  $("fileHint").style.display = "flex";
  $("liveTxt").textContent = "离线 · file 模式";
}
layoutGraph();
renderMetrics(); renderTokenBar(); renderTasks(); renderMsg(); renderArts(); drawGraph(false);
requestAnimationFrame(loop);
poll();
setInterval(poll, 15000);
</script>
<script>
/* 背景粒子网络：力导向 / 引力粒子 + 发光线条（Bram · 视觉轮；纯前端，不触 server.py）*/
(function(){
  var cv=document.getElementById('bgfield');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var DPR=Math.min(2,window.devicePixelRatio||1);
  var W=640,H=480,CX=320,CY=240,gx=320,gy=240,LINK=120,LINK2=14400,N=36,ps=[];
  function rnd(a,b){return a+Math.random()*(b-a);}
  function capN(){return Math.max(36,Math.min(92,Math.round(W*H/17000)));}
  function seed(){ps=[];for(var i=0;i<N;i++){ps.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.2,.2),vy:rnd(-.2,.2),r:rnd(.4,1.5)});}}
  function resize(){
    W=Math.max(320,cv.clientWidth||window.innerWidth);
    H=Math.max(240,cv.clientHeight||window.innerHeight);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX=W*0.5;CY=H*0.46;gx=CX;gy=CY;
    N=capN();LINK=Math.max(90,Math.min(150,Math.min(W,H)*0.16));LINK2=LINK*LINK;
    seed();
  }
  resize();
  var paused=false,bp=document.getElementById('btnPause');
  if(bp)bp.addEventListener('click',function(){paused=!paused;});
  function step(){
    gx+=(CX-gx)*0.012+rnd(-.5,.5); gy+=(CY-gy)*0.012+rnd(-.5,.5);
    var i,j,p,q;
    for(i=0;i<ps.length;i++){p=ps[i];
      var dx=gx-p.x,dy=gy-p.y,d2=dx*dx+dy*dy+800,f=2800/d2;
      p.vx+=dx*f*0.02; p.vy+=dy*f*0.02;
      p.vx+=rnd(-.012,.012); p.vy+=rnd(-.012,.012);
      p.vx*=0.994; p.vy*=0.994;
      var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      if(sp>0.95){p.vx*=0.95/sp;p.vy*=0.95/sp;}
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-24)p.x=W+24; if(p.x>W+24)p.x=-24; if(p.y<-24)p.y=H+24; if(p.y>H+24)p.y=-24;
    }
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(6,12,24,0.22)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(i=0;i<ps.length;i++){p=ps[i];
      for(j=i+1;j<ps.length;j++){q=ps[j];
        var ax=p.x-q.x,ay=p.y-q.y,dd=ax*ax+ay*ay;
        if(dd<LINK2){var al=(1-dd/LINK2)*0.45;
          ctx.strokeStyle='rgba(62,198,214,'+al.toFixed(3)+')';
          ctx.lineWidth=0.6;
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
        }
      }
    }
    for(i=0;i<ps.length;i++){p=ps[i];
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,6.2832);
      ctx.fillStyle='rgba(150,210,255,0.06)';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle='rgba(180,225,255,0.9)';ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  function loop(){ if(!paused)step(); requestAnimationFrame(loop); }
  loop();
  var rt=null;
  window.addEventListener('resize',function(){if(rt)clearTimeout(rt);rt=setTimeout(resize,180);});
})();
</script>
